[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlnode"
dynamic = ["version"]
description = "JSON-described DAG → executable PyTorch nn.Module, with static shape validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Nasser Obeid", email = "nasserobeid8@gmail.com" },
]
keywords = [
    "pytorch",
    "deep-learning",
    "neural-networks",
    "dag",
    "computational-graph",
    "visual-programming",
    "model-builder",
    "json",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# torch >= 2.4 is required for nn.RMSNorm (registered in layers/registry.py).
dependencies = [
    "torch>=2.4",
    "networkx>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# HuggingFace nodes (hf_model / hf_config) — pip install "mlnode[hf]"
hf = [
    "transformers>=4.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "transformers>=4.30",
]

[project.urls]
Homepage = "https://github.com/Nasser-Obeid/MLnode"
Repository = "https://github.com/Nasser-Obeid/MLnode"
Issues = "https://github.com/Nasser-Obeid/MLnode/issues"
Changelog = "https://github.com/Nasser-Obeid/MLnode/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Nasser-Obeid/MLnode/tree/main/docs"
Editor = "https://github.com/Nasser-Obeid/MLnode-editor"

[tool.hatch.version]
path = "src/mlnode/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlnode"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/examples/notebooks/data",
    "/.coverage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that download HuggingFace models",
    "gpu: marks tests that require CUDA",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
