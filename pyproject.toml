[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlnode"
dynamic = ["version"]
description = "JSON-described DAG → executable PyTorch nn.Module, with static shape validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Nasser Obeid", email = "nasserobeid8@gmail.com" },
]
keywords = [
    "pytorch",
    "deep-learning",
    "neural-networks",
    "dag",
    "computational-graph",
    "visual-programming",
    "model-builder",
    "json",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# torch >= 2.4 is required for nn.RMSNorm (registered in layers/registry.py).
# Newer Pythons need the first releases that ship wheels for them on both
# Linux and Windows: torch 2.9 / pydantic 2.12 (3.14), torch 2.14 / pydantic 2.14 (3.15).
# Note: torch 3.15 wheels are published on download.pytorch.org, not PyPI — see README.
dependencies = [
    "torch>=2.4; python_version < '3.14'",
    "torch>=2.9; python_version == '3.14'",
    "torch>=2.14; python_version >= '3.15'",
    "networkx>=3.0",
    "pydantic>=2.0; python_version < '3.14'",
    "pydantic>=2.12; python_version == '3.14'",
    "pydantic>=2.14; python_version >= '3.15'",
]

[project.optional-dependencies]
# HuggingFace nodes (hf_model / hf_config) — pip install "mlnode[hf]"
hf = [
    "transformers>=4.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "transformers>=4.30",
]

[project.urls]
Homepage = "https://github.com/Nasser-Obeid/MLnode"
Repository = "https://github.com/Nasser-Obeid/MLnode"
Issues = "https://github.com/Nasser-Obeid/MLnode/issues"
Changelog = "https://github.com/Nasser-Obeid/MLnode/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Nasser-Obeid/MLnode/tree/main/docs"
Editor = "https://nasser-obeid.github.io/mlnode-editor/"
"Editor source" = "https://github.com/Nasser-Obeid/mlnode-editor"

[tool.hatch.version]
path = "src/mlnode/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlnode"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/examples/notebooks/data",
    "/.coverage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that download HuggingFace models",
    "gpu: marks tests that require CUDA",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "PLW1514"]
# PLW1514 (open() without encoding=) is a preview rule; enable only rules named
# explicitly. It guards Windows, where the default encoding is not UTF-8 before 3.15.
preview = true
explicit-preview-rules = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
